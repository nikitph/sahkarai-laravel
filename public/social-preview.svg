<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1120" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fffd"/>
      <stop offset="0.5" stop-color="#eefbf8"/>
      <stop offset="1" stop-color="#e4f5fa"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="15%" y1="20%" x2="85%" y2="80%" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7"/>
      <stop offset="0.28" stop-color="#0ea5e9"/>
      <stop offset="0.52" stop-color="#0d9488"/>
      <stop offset="0.76" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="left-head" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="right-head" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="2" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0f766e" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <rect width="1200" height="630" rx="34" fill="url(#grid)"/>
  <circle cx="1065" cy="85" r="240" fill="#10b981" opacity="0.07"/>
  <circle cx="1085" cy="565" r="315" fill="#0ea5e9" opacity="0.06"/>

  <g transform="translate(65 133) scale(.53)" filter="url(#soft-shadow)">
    <path d="M237.5 216.4A85 85 0 1 0 340.1 350.1L459.9 229.9A85 85 0 0 1 477.5 216.4"
          fill="none" stroke="url(#ribbon)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M562.5 216.4A85 85 0 1 1 459.9 350.1L340.1 229.9A85 85 0 0 0 322.5 216.4"
          fill="none" stroke="url(#ribbon)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="280" cy="132" r="34" fill="url(#left-head)"/>
    <circle cx="520" cy="132" r="34" fill="url(#right-head)"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="420" y="242" fill="#071b2e" font-size="78" font-weight="750" letter-spacing="-3">SahkarAI</text>
    <text x="424" y="298" fill="#0f766e" font-size="24" font-weight="700" letter-spacing="4">REGULATORY INTELLIGENCE</text>
    <text x="424" y="381" fill="#263b4e" font-size="35" font-weight="500">Circulars you can discover,</text>
    <text x="424" y="427" fill="#263b4e" font-size="35" font-weight="500">understand and investigate.</text>
  </g>

  <g transform="translate(424 486)" font-family="Inter, Arial, sans-serif">
    <rect width="430" height="58" rx="29" fill="#ffffff" stroke="#c7e4df" filter="url(#shadow)"/>
    <circle cx="31" cy="29" r="8" fill="#10b981"/>
    <text x="53" y="38" fill="#315063" font-size="22" font-weight="600">Source-grounded • Version-bound</text>
  </g>
