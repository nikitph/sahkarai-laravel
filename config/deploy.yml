# Kamal deploy for the SahkarAI production application.
# Deploys the ALREADY-PUBLISHED multi-arch image from GHCR (no build here).
service: sahkarai-laravel
minimum_version: 2.6.1
# Runtime >=0.2.0-dev ships HEALTHCHECK NONE, so non-web roles need no workaround.
image: nikitph/sahkarai-laravel

registry:
  server: ghcr.io
  username: nikitph
  password:
    - KAMAL_REGISTRY_PASSWORD

# We deploy a prebuilt image; arch matters because the droplet is amd64.
builder:
  arch: amd64

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    # Only the web role migrates. Kamal boots the primary web role to healthy
    # before any other role, so the schema exists before workers start — no
    # pre-deploy hook, no crash-looping workers.
    # Redis supplies the shared migration lock, so overlapping deploys cannot
    # race migrations even on a brand-new database.
    env:
      clear:
        AUTORUN_ENABLED: "true"
        AUTORUN_LARAVEL_MIGRATION: "true"
        AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
  worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: php artisan queue:work --tries=3 --sleep=1 --timeout=600 --max-time=3600
    proxy: false
  scheduler:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: php artisan schedule:work
    proxy: false

# kamal-proxy terminates :80 and forwards to the web role's app_port.
# THE question this test exists to answer: does SSE survive this proxy?
proxy:
  ssl: true
  hosts: <%= ENV.fetch("APP_HOSTS", ENV.fetch("APP_HOST")).split(",").map(&:strip) %>
  app_port: 8080
  healthcheck:
    path: /up
    interval: 3
    timeout: 20

env:
  clear:
    APP_NAME: SahkarAI
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://<%= ENV.fetch("APP_HOST") %>
    AUTO_VERIFY_EMAIL: "true"
    LOG_CHANNEL: stderr
    LOG_STACK: stderr
    LOG_LEVEL: debug

    DB_CONNECTION: pgsql
    DB_HOST: sahkarai-laravel-postgres # accessory container name on the kamal network
    DB_PORT: "5432"
    DB_DATABASE: app
    DB_USERNAME: app

    SESSION_DRIVER: database
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    REGULATORY_STORAGE_DISK: <%= ENV.fetch("REGULATORY_STORAGE_DISK", "local") %>
    AWS_DEFAULT_REGION: "<%= ENV.fetch("SPACES_REGION", "blr1") %>"
    AWS_BUCKET: "<%= ENV.fetch("SPACES_BUCKET_NAME", "") %>"
    AWS_ENDPOINT: "<%= ENV.fetch("SPACES_ENDPOINT", "") %>"
    AWS_USE_PATH_STYLE_ENDPOINT: "false"
    REDIS_CLIENT: phpredis
    REDIS_HOST: sahkarai-laravel-redis
    REDIS_PORT: "6379"
    REDIS_QUEUE_RETRY_AFTER: "660"

    REGULATORY_USER_AGENT: "SahkarAI/1.0 (+https://<%= ENV.fetch("APP_HOST") %>)"
    REGULATORY_BROWSER_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
    INCOME_TAX_FEED_URL: https://wmstatic-prd.incometaxindia.gov.in/circular-rss-feed/-/asset_publisher/bxhj/rss
    KIMI_OCR_ENABLED: "true"
    KIMI_OCR_TIMEOUT: "180"
    KIMI_OCR_ATTEMPTS: "3"

    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: conformance
    REVERB_APP_KEY: conformancekey
    REVERB_HOST: <%= ENV.fetch("DEPLOY_REVERB_HOST") %>   # via kamal-proxy
    REVERB_PORT: "443"
    REVERB_SCHEME: https
    REVERB_PUBLIC_HOST: <%= ENV.fetch("DEPLOY_REVERB_HOST") %>
    REVERB_PUBLIC_PORT: "443"
    REVERB_PUBLIC_SCHEME: https

    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"   # production: full opcache benefit
    HEALTHCHECK_PATH: /up
  secret:
    - APP_KEY
    - DB_PASSWORD
    - REVERB_APP_SECRET
    - DEEPSEEK_API_KEY
    - KIMI_API_KEY
    - RAZORPAY_KEY_ID
    - RAZORPAY_KEY_SECRET
    - RAZORPAY_WEBHOOK_SECRET
    - RAZORPAY_TIER_1_PLAN_ID
    - RAZORPAY_TIER_2_PLAN_ID
    - RAZORPAY_TIER_3_PLAN_ID
<% if ENV.fetch("REGULATORY_STORAGE_DISK", "local") == "s3" %>
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
<% end %>

# Immutable regulatory originals must outlive image/container replacement. Web
# serves downloads while workers acquire/extract, so every app role mounts the
# same single-host Docker volume.
volumes:
  - "sahkarai_storage:/var/www/html/storage/app"

accessories:
  postgres:
    image: postgres:17-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_DB: app
        POSTGRES_USER: app
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: redis-server --appendonly yes
    directories:
      - data:/data

ssh:
  user: <%= ENV.fetch("DEPLOY_USER", "deploy") %>
  keys:
    - ~/.ssh/sahkarai_laravel_deploy
