name: infrastructure review

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'ops/**'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/infrastructure-review.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false

      - name: Validate OpenTofu
        working-directory: infra/tofu
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

      - name: Install Ansible validation tools
        run: |
          python -m pip install --disable-pip-version-check \
            ansible-core==2.18.6 \
            ansible-lint==25.6.1
          ansible-galaxy install -r infra/ansible/requirements.yml

      - name: Validate Ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg
        run: ansible-lint infra/ansible/site.yml infra/ansible/verify.yml

      - name: Validate operational scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck ops/bootstrap-production ops/render-ansible-inventory \
            ops/rollback-production ops/verify-production

  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production-infrastructure-plan
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_key_fingerprints: ${{ secrets.DO_SSH_KEY_FINGERPRINTS_JSON }}
      TF_VAR_ssh_allowed_cidrs: ${{ secrets.DO_SSH_ALLOWED_CIDRS_JSON }}
      TF_VAR_spaces_bucket_name: ${{ vars.SPACES_BUCKET_NAME }}
      TF_VAR_create_spaces_bucket: ${{ vars.CREATE_SPACES_BUCKET || 'false' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false

      - name: Initialize production state
        working-directory: infra/tofu
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TOFU_STATE_KEY || 'sahkarai/production/tofu.tfstate' }}" \
            -backend-config="region=${{ vars.TOFU_STATE_REGION || 'blr1' }}" \
            -backend-config="endpoints.s3=https://${{ vars.TOFU_STATE_REGION || 'blr1' }}.digitaloceanspaces.com" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="use_path_style=false" \
            -backend-config="encrypt=true"

      - name: Create the production infrastructure plan
        working-directory: infra/tofu
        run: |
          tofu plan -input=false -no-color -out=production.tfplan
          {
            echo '## OpenTofu production plan'
            echo '```text'
            tofu show -no-color production.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
